name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint notebook
        run: ruff check .

      - name: Execute notebook end to end
        env:
          MPLBACKEND: Agg
        run: jupyter nbconvert --to notebook --execute fcc_seeds_unsupervised.ipynb --output-dir "$RUNNER_TEMP"
